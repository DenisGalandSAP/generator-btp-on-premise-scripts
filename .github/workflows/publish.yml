# Publishes the package to npm when a version tag (v1.2.3) is pushed. npm trusted publishing: no token is
# stored, the job proves with GitHub's OIDC token that it runs this workflow of this repository, and npm adds a
# provenance statement. One-time setup on npm (owner of the package):
#   npm trust github @scodigis/generator-btp-on-premise-scripts --file publish.yml --repo DenisGalandSAP/generator-btp-on-premise-scripts --allow-publish
name: publish
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      # trusted publishing needs npm 11.5.1 or later; early Node 24 releases came with an older one
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: npm publish --access public
